[global]
   server role = standalone server
   server string = Time Machine
   workgroup = WORKGROUP
   disable netbios = yes
   smb ports = 445
   security = user
   map to guest = never
   restrict anonymous = 2
   # Only list shares the logged-in user may open.
   access based share enum = yes

   server min protocol = SMB3
   server smb encrypt = desired

   # Accounts survive container rebuilds on the /config volume.
   passdb backend = tdbsam:/config/samba/passdb.tdb
   private dir = /config/samba/private

   logging = file
   log level = 1

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # macOS / Time Machine support
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

# Repository shares, generated by the web UI.
include = /etc/samba/shares.conf
